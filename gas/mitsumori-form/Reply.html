<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif; font-size: 13px; color: #1E293B; margin: 0; padding: 0; background: #F4F7FF; }
  .wrap { display: flex; height: 100vh; }
  .list { width: 260px; border-right: 1px solid #DDE4F8; background: #fff; overflow-y: auto; flex-shrink: 0; }
  .list-item { padding: 11px 13px; border-bottom: 1px solid #EEF2FF; cursor: pointer; }
  .list-item:hover { background: #F4F7FF; }
  .list-item.active { background: #EEF2FF; border-left: 3px solid #3B6EF8; padding-left: 10px; }
  .li-from { font-weight: 700; font-size: 12.5px; }
  .li-mail { font-size: 11.5px; color: #5A6A8A; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-sub { font-size: 11.5px; color: #5A6A8A; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-date { font-size: 11px; color: #8A97B8; margin-top: 3px; }
  .main { flex: 1; display: flex; flex-direction: column; padding: 14px; overflow-y: auto; }
  .card { background: #fff; border: 1px solid #DDE4F8; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; }
  .quote { font-size: 12px; color: #5A6A8A; line-height: 1.7; white-space: pre-wrap; }
  label { display: block; font-size: 11.5px; font-weight: 700; color: #5A6A8A; margin-bottom: 5px; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid #DDE4F8; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: inherit; line-height: 1.8; resize: vertical; }
  textarea:focus { outline: none; border-color: #3B6EF8; }
  #editor { min-height: 280px; }
  #instruction { min-height: 56px; }
  #customerMail { min-height: 170px; background: #FAFBFF; color: #5A6A8A; font-size: 12.5px; line-height: 1.8; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .b-main { background: #FF6B35; color: #fff; }
  .b-ai { background: #3B6EF8; color: #fff; }
  .b-sub { background: #fff; color: #3B6EF8; border: 1px solid #DDE4F8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 10px; padding: 9px 11px; border-radius: 8px; font-size: 12px; line-height: 1.6; display: none; white-space: pre-wrap; }
  .msg-ok { background: #e6f6ec; color: #2c9e5e; }
  .msg-err { background: #fdeceb; color: #e5484d; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #DDE4F8; border-top-color: #3B6EF8; border-radius: 50%; vertical-align: middle; margin-right: 6px; animation: msgspin 0.7s linear infinite; }
  @keyframes msgspin { to { transform: rotate(360deg); } }
  .busy-banner {
    display: none;
    align-items: center;
    gap: 8px;
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #3B6EF8;
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    padding: 9px 14px;
    z-index: 999;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .busy-banner .spinner { border-color: rgba(255,255,255,0.4); border-top-color: #fff; margin-right: 0; }
  .empty { padding: 40px 20px; text-align: center; color: #8A97B8; }
  .log { font-size: 11.5px; color: #8A97B8; white-space: pre-wrap; line-height: 1.6; margin-top: 6px; }
  select { width: 100%; box-sizing: border-box; border: 1px solid #DDE4F8; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; background: #fff; }
  .tasks-note { font-size: 12.5px; color: #5A6A8A; margin-top: 9px; }
  .tasks { background: #FFF6F1; border: 1px solid #FFD9C7; border-radius: 8px; padding: 9px 12px; margin-top: 9px; }
  .tasks-title { font-size: 12px; font-weight: 700; color: #C24A18; margin-bottom: 4px; }
  .tasks ul { margin: 0; padding-left: 18px; }
  .tasks li { font-size: 12.5px; color: #5A6A8A; line-height: 1.8; }
  .extras { background: #FFF6F1; border: 1px solid #FFD9C7; border-radius: 8px; padding: 11px 13px; margin-top: 10px; }
  .extras-title { font-size: 12px; font-weight: 700; color: #C24A18; margin-bottom: 6px; }
  .ex-label { display: block; font-size: 11.5px; font-weight: 700; color: #5A6A8A; margin: 9px 0 4px; }
  .extras input { width: 100%; box-sizing: border-box; border: 1px solid #FFD9C7; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; background: #fff; }
  .inv { border-top: 1px solid #FFD9C7; margin-top: 12px; padding-top: 10px; }
  .inv-state { font-size: 12.5px; color: #5A6A8A; margin-bottom: 2px; }
  .steps-text { font-size: 12px; color: #5A6A8A; line-height: 1.9; white-space: pre-wrap; background: #fff; border-radius: 8px; padding: 8px 11px; margin: 8px 0 0; }
  .hint { font-size: 11.5px; color: #8A97B8; margin-top: 6px; line-height: 1.6; }
  .files { margin-top: 8px; }
  .files-add { font-size: 12px; color: #3B6EF8; cursor: pointer; }
  .file-item { display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: #3D4A66; background: #F6F8FE; border-radius: 5px; padding: 5px 9px; margin-top: 5px; }
  .file-size { color: #8A97B8; }
  .file-del { margin-left: auto; color: #E5484D; cursor: pointer; border: 0; background: none;
    font-size: 12px; padding: 0; }
  .hist { margin-top: 9px; }
  .hist summary { font-size: 12px; color: #3B6EF8; cursor: pointer; }
  .hist-item { border-top: 1px solid #EEF2FF; padding: 8px 0 0; margin-top: 8px; }
  .hist-item.out { padding-left: 18px; }
  .hist-head { font-size: 11.5px; color: #8A97B8; margin-bottom: 3px; }
  .hist-dir { display: inline-block; min-width: 30px; margin-right: 6px; padding: 1px 5px; border-radius: 3px;
    font-size: 10.5px; text-align: center; background: #E9F0FF; color: #3B6EF8; }
  .hist-item.out .hist-dir { background: #F1EFE8; color: #8A7B55; }
  .hist-item.form .hist-dir { background: #EFE9FB; color: #6B4FBB; }
  .hist-body { font-size: 12px; color: #5A6A8A; line-height: 1.8; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>

<div class="busy-banner" id="busyBanner"><span class="spinner"></span><span id="busyText"></span></div>
<div class="wrap">
  <div class="list" id="list"><div class="empty">読み込み中...</div></div>
  <div class="main" id="main"><div class="empty">左の一覧から選んでください。</div></div>
</div>

<script>
  var items = [];
  var types = [];
  var current = null;
  var ctx = null;
  var lastApplied = null;
  /**
   * 入力欄にいま入っている値の控え。
   *
   * 返送の点数や追跡番号は**案件ボードに保管場所が無い**ため、
   * 画面を描き直すたびに空へ戻っていた。実際にそれで点数が記録されずに送られた。
   * 対応の種類ごとに覚えておき、描き直しても消えないようにする。
   */
  var typed = {};

  function el(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.addEventListener('error', function (e) {
    var m = el('msg');
    if (!m) return;
    m.className = 'msg msg-err';
    m.textContent = '画面エラー: ' + e.message;
    m.style.display = 'block';
  });

  function findType(id) {
    var hit = null;
    types.forEach(function (t) { if (t.id === id) hit = t; });
    return hit;
  }

  /** 添付するファイル。{name, type, size, data(base64)} を並べて持つ。 */
  var attachments = [];
  /** 読み込み中のファイル数。0になるまで送信させない。 */
  var reading = 0;
  /**
   * 合計10MBまで。Gmailの上限は25MBだが、
   * ファイルの中身は文字に直してシートの画面から渡すため、余裕を持たせる。
   */
  var ATTACH_MAX = 10 * 1024 * 1024;

  function renderFiles() {
    var box = el('fileList');
    if (!box) return;
    box.innerHTML = attachments.map(function (f, i) {
      return '<div class="file-item"><span>' + esc(f.name) + '</span>' +
        '<span class="file-size">' + Math.max(1, Math.round(f.size / 1024)) + ' KB</span>' +
        '<button class="file-del" data-i="' + i + '">外す</button></div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.file-del'), function (b) {
      b.addEventListener('click', function () {
        attachments.splice(Number(b.getAttribute('data-i')), 1);
        renderFiles();
      });
    });
  }

  /** 選ばれたファイルを読み込んで控える。読み終わるまで送信は押せない。 */
  function addFiles(list) {
    Array.prototype.forEach.call(list, function (file) {
      var total = attachments.reduce(function (sum, f) { return sum + f.size; }, 0);
      if (total + file.size > ATTACH_MAX) {
        show('err', '添付の合計が10MBを超えます。「' + file.name + '」は追加しませんでした。');
        return;
      }
      var reader = new FileReader();
      reading++;
      reader.onload = function () {
        reading--;
        attachments.push({
          name: file.name,
          type: file.type || 'application/octet-stream',
          size: file.size,
          data: String(reader.result).split(',')[1] || ''
        });
        renderFiles();
        updateApprove();
      };
      reader.onerror = function () {
        reading--;
        updateApprove();
        show('err', '「' + file.name + '」を読み込めませんでした。');
      };
      reader.readAsDataURL(file);
    });
    updateApprove();
  }

  function typedKey(type) { return (current ? current.row : 0) + ':' + type.id; }

  function remember(type, key, value) {
    var box = typedKey(type);
    if (!typed[box]) typed[box] = {};
    typed[box][key] = value;
  }

  /** 入力欄に出す値。手で入れた控えを優先し、無ければ案件の値を使う。 */
  function remembered(type, key) {
    var box = typed[typedKey(type)];
    if (box && box[key] != null && box[key] !== '') return box[key];
    return ctx && ctx[key] != null ? ctx[key] : '';
  }

  /** 対応種別ごとに出している入力欄の、現在の値を集める。 */
  function collectFields(type) {
    var data = {};
    if (!type) return data;
    (type.fields || []).forEach(function (f) {
      var input = el('fx_' + f.key);
      if (input) { data[f.key] = input.value; remember(type, f.key, input.value); return; }
      // 入力欄が描かれていないときは控えから拾う。空のまま送ると記録が欠ける
      var box = typed[typedKey(type)];
      if (box && box[f.key] != null) data[f.key] = box[f.key];
    });
    return data;
  }

  function refreshTypeView() {
    var type = findType(el('rtype').value);
    renderTasks(type);
    loadContext(type);
  }

  function renderHistory(list) {
    var box = el('history');
    if (!box) return;
    if (!list || list.length === 0) { box.innerHTML = ''; return; }
    var html = '<details class="hist"><summary>過去のやりとり（' + list.length + '件）</summary>';
    list.forEach(function (h) {
      var kind = h.direction === 'フォーム' ? 'form' : (h.incoming ? 'in' : 'out');
      html += '<div class="hist-item ' + kind + '">' +
        '<div class="hist-head"><span class="hist-dir">' + esc(h.direction) + '</span>' +
        esc(h.date) + '　' + esc(h.subject) + '</div>' +
        '<div class="hist-body">' + esc(h.text) + '</div></div>';
    });
    box.innerHTML = html + '</details>';
  }

  function bindCompose() {
    var btn = el('btnCompose');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var type = findType(el('rtype').value);
      if (!type) { show('err', '先に対応の種類を選んでください。'); return; }

      var fields = collectFields(type);
      var missing = (type.requireKeys || []).filter(function (key) { return !fields[key]; });
      if (missing.length > 0) {
        show('err', '「' + type.requires.join('」「') + '」を入力してから作成してください。');
        return;
      }
      if (el('editor').value.trim() &&
        !confirm('入力内容を反映して、返信案を作り直します。現在の本文は失われます。よろしいですか？')) return;

      busy(true);
      showBusy('入力内容を保存し、AIが返信案を作成しています...');
      google.script.run.withSuccessHandler(function (r) {
        el('editor').value = r.text;
        lastApplied = r.text;
        show('ok', r.message);
        busy(false);
        loadContext(type);
      }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailComposeWithType(current.row, el('rtype').value, fields);
    });
  }

  function renderTasks(type) {
    var box = el('tasks');
    var html = '';
    if (ctx && ctx.missing && ctx.missing.length > 0) {
      html += '<div class="tasks"><div class="tasks-title">依頼確定に不足している情報</div><ul>';
      ctx.missing.forEach(function (label) { html += '<li>' + esc(label) + '</li>'; });
      html += '</ul></div>';
    }
    if (type && type.status) {
      html += '<div class="tasks-note">送信すると、案件のステータスが' +
        '<b>「' + esc(type.status) + '」</b>に変わります。</div>';
    } else if (type) {
      html += '<div class="tasks-note">この対応では、案件のステータスは変わりません。</div>';
    }
    if (type && type.forRegistration && ctx && ctx.registration) {
      var wanted = ctx.repeatCustomer ? 'repeat' : 'first';
      if (type.forRegistration !== wanted) {
        html += '<div class="tasks-note" style="color:#A32D2D">このお客様は' +
          '<b>' + esc(ctx.registration) + '</b>です。' +
          (ctx.repeatCustomer
            ? '「依頼確定・2回目以降」をお選びください。'
            : 'カード登録と契約書署名がまだのため、「依頼確定・初回」をお選びください。') +
          '</div>';
      }
    }
    box.innerHTML = html;
  }

  var INVOICE_LABELS = {
    DRAFT: '下書き（未送信）', UNPAID: '送信済・未払い', SCHEDULED: '送信予約済',
    PAID: '支払い済み', PARTIALLY_PAID: '一部支払い済み', CANCELED: 'キャンセル済み', FAILED: '失敗'
  };

  function composeBlock(type) {
    if (!type) return '<div class="hint">対応の種類を選ぶと、返信案を作れるようになります。</div>';
    return '<div class="btns"><button class="b-ai" id="btnCompose">この対応で返信案を作る</button></div>' +
      '<div class="hint">' + (type.template
        ? '入力内容を保存したうえで、定型文を土台にした返信案をAIが作ります。'
        : 'お客様の内容と回答方針をもとに、AIが返信案を作ります。') + '</div>';
  }

  function renderExtras(type) {
    var box = el('extras');
    if (!type || (type.fields.length === 0 && !type.invoice)) {
      box.innerHTML = composeBlock(type);
      bindCompose();
      updateApprove();
      return;
    }
    if (!ctx || !ctx.caseRow) {
      // 「応答が無い」と「案件が無い」は原因がまったく違う。必ず見分けられるようにする
      var why = !ctx
        ? '<div class="tasks-title">案件情報を受け取れませんでした</div>' +
          '<div style="font-size:12.5px;color:#5A6A8A">シートからの応答がありません。' +
          'この画面を閉じて開き直しても直らない場合は、ログの「②画面」を確認してください。</div>'
        : ctx.reason
        ? '<div class="tasks-title">案件情報を作れませんでした</div>' +
          '<div style="font-size:12.5px;color:#5A6A8A">' + esc(ctx.reason) + '</div>'
        : ctx.stale
        ? '<div class="tasks-title">一覧が古くなっています</div>' +
          '<div style="font-size:12.5px;color:#5A6A8A">開いている間にメール履歴の行が増減しました。' +
          'この画面を閉じて、もう一度「対応を選ぶ」を開いてください。</div>'
        : '<div class="tasks-title">案件が見つかりません</div>' +
          '<div style="font-size:12.5px;color:#5A6A8A">このお客様（' + esc((ctx && ctx.customerId) || '不明') + '）の案件が' +
          '案件ボードにないため、日程の入力や請求書の作成ができません。</div>';
      box.innerHTML = '<div class="tasks">' + why + '</div>' + composeBlock(type);
      bindCompose();
      updateApprove();
      return;
    }

    var html = '<div class="extras"><div class="extras-title">この対応に必要な入力（案件 ' + esc(ctx.caseId) + '）</div>';
    type.fields.forEach(function (f) {
      html += '<label class="ex-label">' + esc(f.label) +
        (type.requireKeys.indexOf(f.key) >= 0 ? ' <span style="color:#e5484d">*</span>' : '') + '</label>' +
        '<input type="' + f.type + '" id="fx_' + f.key + '" value="' + esc(remembered(type, f.key)) + '">';
    });
    if (type.fields.length > 0) {
      var answered = [];
      if (ctx.firstQty) answered.push('初回ご依頼予定数 ' + ctx.firstQty);
      if (ctx.firstDate) answered.push('初回ご依頼予定日 ' + ctx.firstDate);
      if (answered.length > 0) {
        html += '<div class="hint">お客様の回答：' + esc(answered.join('　／　')) + '</div>';
      }
      html += '<div class="btns"><button class="b-sub" id="btnFields">入力内容を保存する</button>' +
        '<button class="b-ai" id="btnCompose">この対応で返信案を作る</button></div>' +
        '<div class="hint">' + (type.template
          ? '［この対応で返信案を作る］を押すと、上の入力内容を保存したうえで返信案に反映します。'
          : '［入力内容を保存する］はシートに保存するだけです。') + '</div>';
    }

    if (type.invoice) {
      var sent = !!ctx.sentAt || (ctx.invoiceStatus && ctx.invoiceStatus !== 'DRAFT');
      html += '<div class="inv"><div class="extras-title">初回登録の請求書（220円・税込）</div>' +
        '<div class="inv-state">' + (ctx.invoiceId
          ? '状態: ' + (INVOICE_LABELS[ctx.invoiceStatus] || ctx.invoiceStatus)
          : 'まだ作成されていません') + '</div>' +
        '<div class="btns"><button class="b-sub" id="btnInvNew">請求書を作成する</button></div>' +
        '<div class="steps-text">' + esc(ctx.invoiceSteps) + '</div>' +
        '<div class="btns"><button class="b-sub" id="btnInvOpen">Squareで請求書を開く</button>' +
        '<button class="b-sub" id="btnInvSent">送信しました</button></div></div>';
    }
    box.innerHTML = html + '</div>' + (type.fields.length > 0 ? '' : composeBlock(type));
    bindCompose();

    if (type.fields.length > 0) {
      el('btnFields').addEventListener('click', function () {
        google.script.run.withSuccessHandler(function (r) {
          show('ok', r.message + (type.template
            ? '\n返信案にも反映するには［この対応で返信案を作る］を押してください。' : ''));
          loadContext(type);
        }).withFailureHandler(function (e) { show('err', e.message); })
          .mailSaveCaseFields(ctx.caseRow, collectFields(type));
      });
      type.fields.forEach(function (f) {
        el('fx_' + f.key).addEventListener('input', function () {
          remember(type, f.key, this.value);
          updateApprove();
        });
      });
    }

    if (type.invoice) {
      var invSent = !!ctx.sentAt || (ctx.invoiceStatus && ctx.invoiceStatus !== 'DRAFT');
      el('btnInvNew').disabled = !!ctx.invoiceId;
      el('btnInvOpen').disabled = !ctx.invoiceId;
      el('btnInvSent').disabled = !ctx.invoiceId || invSent;
      el('btnInvNew').addEventListener('click', function () {
        el('btnInvNew').disabled = true;
        show('ok', '請求書を作成しています...');
        google.script.run.withSuccessHandler(function (r) { show('ok', r.message); loadContext(type); })
          .withFailureHandler(function (e) { show('err', e.message); loadContext(type); })
          .squareCreateDraftForCase(ctx.caseRow);
      });
      el('btnInvOpen').addEventListener('click', function () { window.open(ctx.invoiceUrl, '_blank'); });
      el('btnInvSent').addEventListener('click', function () {
        el('btnInvSent').disabled = true;
        google.script.run.withSuccessHandler(function (r) { show('ok', r.message); loadContext(type); })
          .withFailureHandler(function (e) { show('err', e.message); loadContext(type); })
          .squareConfirmSent(ctx.caseRow);
      });
    }

    updateApprove();
  }

  function updateApprove() {
    var type = findType(el('rtype') ? el('rtype').value : '');
    var btn = el('btnApprove');
    if (!btn || !type) return;
    var missing = [];
    (type.requireKeys || []).forEach(function (key) {
      var input = el('fx_' + key);
      if (!input || !input.value) missing.push(key);
    });
    btn.disabled = missing.length > 0 || reading > 0;
    var hint = el('approveHint');
    if (hint) {
      hint.textContent = reading > 0
        ? '添付ファイルを読み込んでいます...'
        : missing.length > 0
        ? '「' + type.requires.join('」「') + '」を入力すると押せるようになります。'
        : '';
    }
  }

  /**
   * 契約済みのお客様には「依頼確定・2回目以降」を、まだの方には「初回」を先に出す。
   * 合わないほうは消さずに末尾へ回すだけなので、必要なら選び直せる。
   */
  function orderTypeOptions() {
    if (!ctx || !ctx.registration) return;
    var demote = ctx.repeatCustomer ? 'first' : 'repeat';
    var sel = el('rtype');
    types.forEach(function (t) {
      if (t.forRegistration !== demote) return;
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === t.id) { sel.appendChild(sel.options[i]); return; }
      }
    });
  }

  function loadContext(type) {
    google.script.run.withSuccessHandler(function (data) {
      ctx = data;
      orderTypeOptions();
      renderTasks(type);
      renderExtras(type);
    }).withFailureHandler(function (e) {
      // 失敗したまま何も描かないと、原因が分からないまま画面が止まる
      ctx = null;
      var box = el('extras');
      if (box) {
        box.innerHTML = '<div class="tasks"><div class="tasks-title">案件情報を読み込めませんでした</div>' +
          '<div style="font-size:12.5px;color:#5A6A8A">' + esc(e.message) + '</div></div>' + composeBlock(type);
        bindCompose();
        updateApprove();
      }
      show('err', e.message);
    }).mailGetCaseContext(current.row, current.customerId);
  }

  function show(kind, text) {
    var m = el('msg');
    if (!m) return;
    m.className = 'msg msg-' + kind;
    m.textContent = text;
    m.style.display = 'block';
  }

  /** 処理中であることが一目でわかるよう、画面上部に固定表示のバナーを出す。 */
  function showBusy(text) {
    var banner = el('busyBanner');
    if (!banner) return;
    el('busyText').textContent = text;
    banner.style.display = 'flex';
  }

  function hideBusy() {
    var banner = el('busyBanner');
    if (banner) banner.style.display = 'none';
  }

  function busy(state) {
    ['btnAi', 'btnRegen', 'btnSave', 'btnApprove', 'btnSkip'].forEach(function (id) {
      var b = el(id);
      if (b) b.disabled = state;
    });
    if (!state) { hideBusy(); updateApprove(); }
  }

  function renderList() {
    var list = el('list');
    if (items.length === 0) {
      list.innerHTML = '<div class="empty">進行中の案件はありません。</div>';
      el('main').innerHTML = '<div class="empty">進行中の案件はありません。</div>';
      return;
    }
    list.innerHTML = '';
    items.forEach(function (item, i) {
      var div = document.createElement('div');
      div.className = 'list-item' + (current && current.row === item.row ? ' active' : '');
      div.innerHTML = '<div class="li-from"></div><div class="li-mail"></div>'
        + '<div class="li-sub"></div><div class="li-date"></div>';
      div.children[0].textContent = item.customer || item.from;
      div.children[1].textContent = item.from;
      div.children[2].textContent = item.subject || '(件名なし)';
      div.children[3].textContent = item.date + '　' + item.status;
      div.addEventListener('click', function () { select(i); });
      list.appendChild(div);
    });
  }

  function select(index) {
    current = items[index];
    // 添付は選んだメールごとのもの。持ち越すと関係ない相手に送ってしまう
    attachments = [];
    reading = 0;
    el('main').innerHTML =
      '<div class="card"><h3>最新のメール</h3>' +
      '<textarea id="customerMail" readonly></textarea>' +
      '<div id="history"></div>' +
      '<div class="log" id="log"></div></div>' +
      '<div class="card"><label>どの状況での対応か</label>' +
      '<select id="rtype"></select>' +
      '<div id="tasks"></div><div id="extras"></div></div>' +
      '<div class="card"><label>返信案（そのまま編集できます）</label>' +
      '<textarea id="editor"></textarea>' +
      '<div class="files"><input type="file" id="fileInput" multiple style="display:none">' +
      '<span class="files-add" id="fileAdd">＋ ファイルを添付する</span>' +
      '<div id="fileList"></div></div>' +
      '<div class="btns">' +
      '<button class="b-main" id="btnApprove">この内容で送信する</button>' +
      '<button class="b-sub" id="btnOpenThread">Gmailで開く</button>' +
      '<button class="b-sub" id="btnSave">編集内容だけ保存</button>' +
      '<button class="b-sub" id="btnSkip">対応不要</button>' +
      '</div><div class="hint" id="approveHint"></div></div>' +
      '<div class="card"><label>AIに修正を依頼する</label>' +
      '<textarea id="instruction" placeholder="例：もう少し短く。補償の話は書かないで、納期の目安だけ伝えて。"></textarea>' +
      '<div class="btns"><button class="b-ai" id="btnAi">この指示で書き直す</button>' +
      '<button class="b-sub" id="btnRegen">最初から作り直す</button></div>' +
      '<div class="msg" id="msg"></div></div>';

    el('customerMail').value = current.summary || '(本文なし)';
    google.script.run.withSuccessHandler(function (r) {
      el('customerMail').value = r.text;
    }).mailGetCustomerMessage(current.row);
    google.script.run.withSuccessHandler(renderHistory).mailGetHistory(current.row);

    el('editor').value = current.text || '';
    lastApplied = current.text || '';
    el('log').textContent = current.instructions ? '過去の修正指示:\n' + current.instructions : '';

    var sel = el('rtype');
    var blank = document.createElement('option');
    blank.value = '';
    blank.textContent = '（未選択）';
    sel.appendChild(blank);
    types.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t.id;
      o.textContent = t.name;
      if (t.name === current.responseType) o.selected = true;
      sel.appendChild(o);
    });
    refreshTypeView();

    sel.addEventListener('change', function () {
      refreshTypeView();
      google.script.run.mailApplyResponseType(current.row, sel.value);
    });

    el('btnAi').addEventListener('click', function () {
      var instruction = el('instruction').value.trim();
      if (!instruction) { show('err', '修正の指示を入力してください。'); return; }
      busy(true);
      showBusy('AIが書き直しています...');
      google.script.run.withSuccessHandler(function (r) {
        el('editor').value = r.text;
        el('instruction').value = '';
        show('ok', '書き直しました。内容をご確認ください。');
        busy(false);
        reload(true);
      }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailReviseText(current.row, el('editor').value, instruction);
    });

    el('btnRegen').addEventListener('click', function () {
      if (!confirm('AIに最初から作り直させます。現在の本文は失われます。よろしいですか？')) return;
      busy(true);
      showBusy('AIが作り直しています...');
      google.script.run.withSuccessHandler(function (r) {
        el('editor').value = r.text;
        show('ok', r.message);
        busy(false);
        reload(true);
      }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailRegenerate(current.row);
    });

    el('btnSave').addEventListener('click', function () {
      busy(true);
      google.script.run.withSuccessHandler(function (r) { show('ok', r.message); busy(false); reload(true); })
        .withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailSaveText(current.row, el('editor').value);
    });

    el('btnApprove').addEventListener('click', function () {
      // **送ると取り消せない。** 宛先と件名はシートに聞いて、確かめてから送る
      var fields = collectFields(findType(el('rtype').value));
      var body = el('editor').value;
      busy(true);
      show('ok', '宛先を確認しています...');
      google.script.run.withSuccessHandler(function (p) {
        busy(false);
        var names = attachments.map(function (f) { return f.name; }).join('、');
        if (!confirm('このメールを送信します。取り消せません。\n\n' +
          '宛先：' + p.to + '\n件名：' + p.subject +
          (names ? '\n添付：' + names : '') + '\n\n' +
          body.slice(0, 120) + (body.length > 120 ? '…' : '') + '\n\nよろしいですか？')) return;
        busy(true);
        show('ok', '送信しています...');
        google.script.run.withSuccessHandler(function (r) {
          busy(false);
          // 送り終えたら閉じる。開いたままだと送れたか分からず、二度押してしまう
          alert(r.message + '\n\nこの画面を閉じます。' +
            '続けて対応する場合は、メニューから「対応を選ぶ」を開き直してください。');
          google.script.host.close();
        }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
          .mailSendReply(current.row, body, fields, attachments);
      }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailGetSendPreview(current.row);
    });

    el('fileAdd').addEventListener('click', function () { el('fileInput').click(); });
    el('fileInput').addEventListener('change', function () {
      addFiles(this.files);
      this.value = '';
    });

    el('btnOpenThread').addEventListener('click', function () {
      window.open('https://mail.google.com/mail/u/0/#all/' + current.threadId, '_blank');
    });

    el('btnSkip').addEventListener('click', function () {
      busy(true);
      google.script.run.withSuccessHandler(function () { busy(false); reload(false); })
        .withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailDismiss(current.row);
    });

    renderList();
  }

  function reload(keepSelection) {
    google.script.run.withSuccessHandler(function (data) {
      items = data;
      if (!keepSelection) current = null;
      if (items.length === 0) { renderList(); return; }
      if (current) {
        var index = -1;
        items.forEach(function (item, i) { if (item.row === current.row) index = i; });
        if (index >= 0) { current = items[index]; renderList(); return; }
      }
      select(0);
    }).withFailureHandler(function (e) {
      el('list').innerHTML = '<div class="empty">' + e.message + '</div>';
    }).mailGetPendingList();
  }

  google.script.run.withSuccessHandler(function (data) {
    types = data;
    reload(false);
  }).withFailureHandler(function (e) {
    el('list').innerHTML = '<div class="empty">' + e.message + '</div>';
  }).mailGetResponseTypes();
</script>
</body>
</html>
