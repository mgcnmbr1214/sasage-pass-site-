<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif; font-size: 13px; color: #1E293B; margin: 0; padding: 0; background: #F4F7FF; }
  .wrap { display: flex; height: 100vh; }
  .list { width: 260px; border-right: 1px solid #DDE4F8; background: #fff; overflow-y: auto; flex-shrink: 0; }
  .list-item { padding: 11px 13px; border-bottom: 1px solid #EEF2FF; cursor: pointer; }
  .list-item:hover { background: #F4F7FF; }
  .list-item.active { background: #EEF2FF; border-left: 3px solid #3B6EF8; padding-left: 10px; }
  .li-from { font-weight: 700; font-size: 12.5px; }
  .li-sub { font-size: 11.5px; color: #5A6A8A; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li-date { font-size: 11px; color: #8A97B8; margin-top: 3px; }
  .main { flex: 1; display: flex; flex-direction: column; padding: 14px; overflow-y: auto; }
  .card { background: #fff; border: 1px solid #DDE4F8; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; }
  .quote { font-size: 12px; color: #5A6A8A; line-height: 1.7; white-space: pre-wrap; }
  label { display: block; font-size: 11.5px; font-weight: 700; color: #5A6A8A; margin-bottom: 5px; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid #DDE4F8; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: inherit; line-height: 1.8; resize: vertical; }
  textarea:focus { outline: none; border-color: #3B6EF8; }
  #editor { min-height: 260px; }
  #instruction { min-height: 56px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .b-main { background: #FF6B35; color: #fff; }
  .b-ai { background: #3B6EF8; color: #fff; }
  .b-sub { background: #fff; color: #3B6EF8; border: 1px solid #DDE4F8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 10px; padding: 9px 11px; border-radius: 8px; font-size: 12px; line-height: 1.6; display: none; white-space: pre-wrap; }
  .msg-ok { background: #e6f6ec; color: #2c9e5e; }
  .msg-err { background: #fdeceb; color: #e5484d; }
  .empty { padding: 40px 20px; text-align: center; color: #8A97B8; }
  .log { font-size: 11.5px; color: #8A97B8; white-space: pre-wrap; line-height: 1.6; margin-top: 6px; }
  select { width: 100%; box-sizing: border-box; border: 1px solid #DDE4F8; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; background: #fff; }
  .tasks-note { font-size: 12.5px; color: #5A6A8A; margin-top: 9px; }
  .tasks { background: #FFF6F1; border: 1px solid #FFD9C7; border-radius: 8px; padding: 9px 12px; margin-top: 9px; }
  .tasks-title { font-size: 12px; font-weight: 700; color: #C24A18; margin-bottom: 4px; }
  .tasks ul { margin: 0; padding-left: 18px; }
  .tasks li { font-size: 12.5px; color: #5A6A8A; line-height: 1.8; }
</style>
</head>
<body>

<div class="wrap">
  <div class="list" id="list"><div class="empty">読み込み中...</div></div>
  <div class="main" id="main"><div class="empty">左の一覧から選んでください。</div></div>
</div>

<script>
  var items = [];
  var types = [];
  var current = null;

  function el(id) { return document.getElementById(id); }

  function findType(id) {
    var hit = null;
    types.forEach(function (t) { if (t.id === id) hit = t; });
    return hit;
  }

  function confirmReplace(type) {
    if (!type || !type.template && type.id === 'REPLY') {
      return confirm('本文をAIの返信案に戻します。編集内容は失われます。よろしいですか？');
    }
    return confirm('本文を「' + type.name + '」の定型文に差し替えます。編集内容は失われます。よろしいですか？');
  }

  function renderTasks(type) {
    var box = el('tasks');
    if (!type) { box.innerHTML = ''; return; }
    var html = '';
    if (type.status) {
      html += '<div class="tasks-note">下書きに保存すると、案件のステータスが' +
        '<b>「' + type.status + '」</b>に変わります。</div>';
    }
    if (type.tasks && type.tasks.length > 0) {
      html += '<div class="tasks"><div class="tasks-title">この対応と同時に必要な処理</div><ul>';
      type.tasks.forEach(function (t) { html += '<li>' + t.replace(/</g, '&lt;') + '</li>'; });
      html += '</ul></div>';
    }
    box.innerHTML = html;
  }

  function show(kind, text) {
    var m = el('msg');
    if (!m) return;
    m.className = 'msg msg-' + kind;
    m.textContent = text;
    m.style.display = 'block';
  }

  function busy(state) {
    ['btnAi', 'btnSave', 'btnApprove', 'btnSkip'].forEach(function (id) {
      var b = el(id);
      if (b) b.disabled = state;
    });
  }

  function renderList() {
    var list = el('list');
    if (items.length === 0) {
      list.innerHTML = '<div class="empty">確認待ちの返信案はありません。</div>';
      el('main').innerHTML = '<div class="empty">確認待ちの返信案はありません。</div>';
      return;
    }
    list.innerHTML = '';
    items.forEach(function (item, i) {
      var div = document.createElement('div');
      div.className = 'list-item' + (current && current.row === item.row ? ' active' : '');
      div.innerHTML = '<div class="li-from"></div><div class="li-sub"></div><div class="li-date"></div>';
      div.children[0].textContent = item.from;
      div.children[1].textContent = item.subject || '(件名なし)';
      div.children[2].textContent = item.date + '　' + item.status;
      div.addEventListener('click', function () { select(i); });
      list.appendChild(div);
    });
  }

  function select(index) {
    current = items[index];
    el('main').innerHTML =
      '<div class="card"><h3>お客様のメール</h3><div class="quote" id="summary"></div>' +
      '<div class="log" id="log"></div></div>' +
      '<div class="card"><label>どの状況での対応か</label>' +
      '<select id="rtype"></select>' +
      '<div id="tasks"></div></div>' +
      '<div class="card"><label>返信案（そのまま編集できます）</label>' +
      '<textarea id="editor"></textarea>' +
      '<div class="btns">' +
      '<button class="b-main" id="btnApprove">この内容で下書きに保存</button>' +
      '<button class="b-sub" id="btnOpenThread">Gmailで開く</button>' +
      '<button class="b-sub" id="btnSave">編集内容だけ保存</button>' +
      '<button class="b-sub" id="btnSkip">対応不要</button>' +
      '</div></div>' +
      '<div class="card"><label>AIに修正を依頼する</label>' +
      '<textarea id="instruction" placeholder="例：もう少し短く。補償の話は書かないで、納期の目安だけ伝えて。"></textarea>' +
      '<div class="btns"><button class="b-ai" id="btnAi">この指示で書き直す</button></div>' +
      '<div class="msg" id="msg"></div></div>';

    el('summary').textContent = current.summary || '(本文なし)';
    el('editor').value = current.text || '';
    el('log').textContent = current.instructions ? '過去の修正指示:\n' + current.instructions : '';

    var sel = el('rtype');
    types.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t.id;
      o.textContent = t.name;
      if (t.name === current.responseType) o.selected = true;
      sel.appendChild(o);
    });
    renderTasks(findType(sel.value));

    sel.addEventListener('change', function () {
      var type = findType(sel.value);
      renderTasks(type);
      if (!confirmReplace(type)) return;
      show('ok', '文面を差し替えています...');
      google.script.run.withSuccessHandler(function (r) {
        el('editor').value = r.text;
        show('ok', '文面を差し替えました。内容をご確認ください。');
      }).withFailureHandler(function (e) { show('err', e.message); })
        .mailApplyResponseType(current.row, sel.value);
    });

    el('btnAi').addEventListener('click', function () {
      var instruction = el('instruction').value.trim();
      if (!instruction) { show('err', '修正の指示を入力してください。'); return; }
      busy(true);
      show('ok', 'AIが書き直しています...');
      google.script.run.withSuccessHandler(function (r) {
        el('editor').value = r.text;
        el('instruction').value = '';
        show('ok', '書き直しました。内容をご確認ください。');
        busy(false);
        reload(true);
      }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailReviseText(current.row, el('editor').value, instruction);
    });

    el('btnSave').addEventListener('click', function () {
      busy(true);
      google.script.run.withSuccessHandler(function (r) { show('ok', r.message); busy(false); reload(true); })
        .withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailSaveText(current.row, el('editor').value);
    });

    el('btnApprove').addEventListener('click', function () {
      busy(true);
      show('ok', '下書きに保存しています...');
      google.script.run.withSuccessHandler(function (r) {
        var text = r.message;
        if (r.tasks && r.tasks.length > 0) {
          text += '\n\n【このあと必要な処理】\n・' + r.tasks.join('\n・');
        }
        show('ok', text);
        busy(false);
        reload(false);
      }).withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailApproveToDraft(current.row, el('editor').value);
    });

    el('btnOpenThread').addEventListener('click', function () {
      window.open('https://mail.google.com/mail/u/0/#all/' + current.threadId, '_blank');
    });

    el('btnSkip').addEventListener('click', function () {
      busy(true);
      google.script.run.withSuccessHandler(function () { busy(false); reload(false); })
        .withFailureHandler(function (e) { show('err', e.message); busy(false); })
        .mailDismiss(current.row);
    });

    renderList();
  }

  function reload(keepSelection) {
    google.script.run.withSuccessHandler(function (data) {
      items = data;
      if (!keepSelection) current = null;
      if (items.length === 0) { renderList(); return; }
      if (current) {
        var index = -1;
        items.forEach(function (item, i) { if (item.row === current.row) index = i; });
        if (index >= 0) { current = items[index]; renderList(); return; }
      }
      select(0);
    }).withFailureHandler(function (e) {
      el('list').innerHTML = '<div class="empty">' + e.message + '</div>';
    }).mailGetPendingList();
  }

  google.script.run.withSuccessHandler(function (data) {
    types = data;
    reload(false);
  }).withFailureHandler(function (e) {
    el('list').innerHTML = '<div class="empty">' + e.message + '</div>';
  }).mailGetResponseTypes();
</script>
</body>
</html>
